services:
  postgres:
    image: postgres:16-alpine
    container_name: exmgmt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: exmgmt
      POSTGRES_PASSWORD: exmgmt
      POSTGRES_DB: exmgmt
    ports:
      # Host 5433 -> container 5432 (avoids clashing with a native Postgres on 5432)
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exmgmt"]
      interval: 5s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: exmgmt-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\"'"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
  esdata:
