# Native nginx site for the Exception Management platform.
#
# Install:
#   sudo cp deploy/nginx/exmgmt.conf /etc/nginx/sites-available/exmgmt
#   sudo ln -s /etc/nginx/sites-available/exmgmt /etc/nginx/sites-enabled/exmgmt
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS (Let's Encrypt) — certbot rewrites this file to add the 443 server block:
#   sudo certbot --nginx -d your-domain
#
# Serves the built SPA (frontend/dist) and reverse-proxies the API container,
# which listens on 127.0.0.1:4000 (network_mode: host).

server {
    listen 80;
    server_name your-domain;            # <-- change me

    # Output of `npm run build` in frontend/
    root /opt/rohan-sirohi/exception-management/frontend/dist;
    index index.html;

    # Apps POST exceptions here; the API also serves the dashboard API under /api.
    location /ingest {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: serve static assets, fall back to index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
